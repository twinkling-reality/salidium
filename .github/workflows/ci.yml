name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

# A second push to the same branch supersedes the first; there is nothing to learn from a run
# against a commit that is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8

      # Node 24 is a hard requirement, not a preference: the daemon uses the built-in `node:sqlite`.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --audit-level high

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm test

      # The published artifact is a bundle, not the workspace, and the two resolve paths
      # differently: the UI once loaded only because a sibling package happened to sit where the
      # daemon looked, which works in a checkout and 404s for every real installation. So the
      # tarball is built, unpacked somewhere with no workspace above it, and actually run.
      - name: Pack and run the published artifact
        run: |
          set -euo pipefail
          pnpm --filter salidium exec npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/install"
          tar -xzf "$RUNNER_TEMP"/salidium-*.tgz -C "$RUNNER_TEMP/install" --strip-components=1
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/scripts/verify-cli-package.mjs" "$RUNNER_TEMP/install"
          node "$RUNNER_TEMP/install/bundle/salidium.mjs" help > /dev/null

          # Exercise npm's real installed bin shim as well as the unpacked script. The package is a
          # CLI only; it deliberately has no `exports` entry pointing at workspace-only source.
          npm install --prefix "$RUNNER_TEMP/npm-install" "$RUNNER_TEMP"/salidium-*.tgz --ignore-scripts --no-audit --no-fund
          "$RUNNER_TEMP/npm-install/node_modules/.bin/salidium" help > /dev/null

          export SALIDIUM_HOME="$RUNNER_TEMP/home"
          # Let the OS reserve an available port; fixed ports can collide on hosted runners.
          export SALIDIUM_PORT=0
          export SALIDIUM_HISTORY_DAYS=0
          node "$RUNNER_TEMP/install/bundle/salidium.mjs" daemon &
          for _ in $(seq 1 40); do [ -f "$SALIDIUM_HOME/daemon.json" ] && break; sleep 0.5; done
          test -f "$SALIDIUM_HOME/daemon.json" || { echo "daemon never wrote daemon.json"; exit 1; }

          token=$(node -e "console.log(require(process.env.SALIDIUM_HOME + '/daemon.json').token)")
          port=$(node -e "console.log(require(process.env.SALIDIUM_HOME + '/daemon.json').port)")
          # The UI has to come from the bundle, and the API has to refuse an unauthenticated call.
          ui=$(curl -sf -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/")
          open=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/api/info")
          auth=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "http://127.0.0.1:$port/api/info")
          echo "ui=$ui unauthenticated=$open authenticated=$auth"
          # One assertion per line. Chained with `&&`, only the last of the three could ever fail
          # the step: `set -e` ignores a non-final command in an AND-OR list, and the `&&` stops at
          # the first false. That made the unauthenticated probe -- the one that proves the API
          # refuses a caller with no token -- decorative, so an auth bypass would have published.
          test "$ui" = 200
          test "$open" = 401
          test "$auth" = 200

          # The consumer contract ships in the bundle: discovery without a credential, reads with a
          # consumer credential made by the installed CLI, and that credential refused everywhere else.
          consumer=$(node "$RUNNER_TEMP/install/bundle/salidium.mjs" consumer create "ci smoke" --json \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).token))")
          discovery=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/consumer/v1/discovery")
          sessions=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $consumer" "http://127.0.0.1:$port/consumer/v1/sessions")
          escalation=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $consumer" "http://127.0.0.1:$port/api/info")
          echo "consumer discovery=$discovery sessions=$sessions owner-route=$escalation"
          test -f "$SALIDIUM_HOME/consumer.json"
          test "$discovery" = 200
          test "$sessions" = 200
          test "$escalation" = 401

          node "$RUNNER_TEMP/install/bundle/salidium.mjs" stop

      # The sync contract is the only separately published package, and its packed shape is a
      # promise to consumers outside this repository. Checking it only in the release workflow
      # would surface a broken export map or a missing fixture at the moment of an irreversible
      # publish rather than on the pull request that caused it.
      - name: Pack and consume the sync contract outside the monorepo
        run: |
          set -euo pipefail
          pnpm --filter @salidium/sync-contract exec npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/contract-consumer"
          cd "$RUNNER_TEMP/contract-consumer"
          echo '{"type":"module"}' > package.json
          npm install "$RUNNER_TEMP"/salidium-sync-contract-*.tgz --ignore-scripts --no-audit --no-fund
          cp "$GITHUB_WORKSPACE/scripts/verify-sync-contract-package.mjs" check.mjs
          node check.mjs
          node --conditions=development check.mjs

      # The consumer contract is published for the same reason and checked the same way, plus one
      # thing the sync contract does not have: its JSON Schema files must validate every retained
      # fixture on their own, because that is all a consumer in another language gets.
      - name: Pack and consume the consumer contract outside the monorepo
        run: |
          set -euo pipefail
          pnpm --filter @salidium/consumer-contract exec npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/consumer-contract-consumer"
          cd "$RUNNER_TEMP/consumer-contract-consumer"
          echo '{"type":"module"}' > package.json
          npm install "$RUNNER_TEMP"/salidium-consumer-contract-*.tgz --ignore-scripts --no-audit --no-fund
          cp "$GITHUB_WORKSPACE/scripts/verify-consumer-contract-package.mjs" check.mjs
          node check.mjs
          node --conditions=development check.mjs

  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # These are the platform-sensitive seams: native provider paths, OS launch behavior, config
      # parsing, and display paths. The Linux job above remains the exhaustive suite.
      - name: Run platform-focused tests
        run: >-
          pnpm exec vitest run
          packages/adapters/claude-code/src/transcriptParser.test.ts
          packages/adapters/codex/src/rolloutParser.test.ts
          packages/cli/src/runtime.test.ts
          packages/cli/src/integrations.test.ts
          packages/daemon/src/config/daemonConfig.test.ts
          packages/core/src/state/changeLog.test.ts
          packages/ui/src/lib/format.test.ts

      - run: pnpm build

      - name: Check the publishable package shape
        run: pnpm --filter salidium exec npm pack --dry-run

  browser-e2e:
    name: Browser E2E and accessibility
    runs-on: ubuntu-latest
    # Downloading three engines has twice run past 20 minutes on a slow runner and killed the job
    # mid-download. Chromium alone finishes in about a minute, so this ceiling now only has to cover
    # the nightly full-matrix run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--with-deps` runs apt-get, and apt is what actually broke this job: three consecutive runs
      # died mid-download from azure.archive.ubuntu.com, where a 3 MB font package took eight
      # minutes and a 7.5 MB one never finished. The runner image already ships Playwright's system
      # libraries, so the gating path installs browser bundles from Playwright's own CDN and never
      # touches an Ubuntu mirror. The nightly run keeps `--with-deps` because it is the one place a
      # genuinely missing library should be caught, and a slow mirror there only delays a cron job.
      #
      # Engine count is the second lever, not the first. Pushes and pull requests run Chromium;
      # schedules and the manually dispatched release gate carry cross-engine coverage.
      - name: Choose the browser install
        id: engines
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            {
              echo "list=chromium firefox webkit"
              echo "deps=--with-deps"
              echo "full=1"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "list=chromium"
              echo "deps="
              echo "full="
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Install browsers
        run: pnpm exec playwright install ${{ steps.engines.outputs.deps }} ${{ steps.engines.outputs.list }}

      - name: Run real-daemon browser tests
        env:
          PLAYWRIGHT_FULL_BROWSERS: ${{ steps.engines.outputs.full }}
        run: pnpm test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npm run lint

      - run: npm test

      - run: npx wrangler deploy --dry-run
